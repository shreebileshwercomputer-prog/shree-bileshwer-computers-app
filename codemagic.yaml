workflows:
  android-apk:
    name: SHREE BILESHWER COMPUTERS - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "in.shreebileshwer.computers"
      java: 17
    scripts:
      - name: Check Android project
        script: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
      - name: Build debug APK
        script: |
          gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
